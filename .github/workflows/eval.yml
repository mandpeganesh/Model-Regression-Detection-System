name: Prompt regression eval

on:
  pull_request:
    paths: ["prompts/**", "data/golden.json"]
  push:
    branches: [main]
    paths: ["prompts/**", "data/golden.json"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eval-history
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Prompts are immutable
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MR "origin/${{ github.base_ref }}...HEAD" -- prompts/)
          if [ -n "$changed" ]; then
            echo "::error::Prompts are immutable; add a new version file instead of editing: $changed"
            exit 1
          fi

      # History lives on the eval-history branch, attached at history/.
      - name: Attach eval-history
        run: |
          if git ls-remote --exit-code --heads origin eval-history; then
            git fetch --depth=1 origin eval-history && git worktree add history FETCH_HEAD
          else
            git worktree add --orphan -b eval-history history
          fi

      - name: Run eval
        id: eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WARN_THRESHOLD: ${{ vars.WARN_THRESHOLD }}
          CRITICAL_THRESHOLD: ${{ vars.CRITICAL_THRESHOLD }}
          DRIFT_THRESHOLD: ${{ vars.DRIFT_THRESHOLD }}
          DRIFT_WINDOW: ${{ vars.DRIFT_WINDOW }}
          RELEVANCE_PASS_MIN: ${{ vars.RELEVANCE_PASS_MIN }}
          MAX_CONCURRENCY: ${{ vars.MAX_CONCURRENCY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m regress run --db history/runs.db --record-to history/pr-runs.db --pr-number ${{ github.event.pull_request.number }} --head-sha ${{ github.event.pull_request.head.sha }}
          else
            python -m regress run --db history/runs.db
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
          if-no-files-found: ignore

      # Exit 2 means nothing was stored, so there is nothing new to commit.
      - name: Save history
        if: steps.eval.outputs.code == '0' || steps.eval.outputs.code == '1'
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "eval: ${{ github.event_name }} ${{ github.sha }}"
          git push origin HEAD:eval-history

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file reports/summary.md --edit-last --create-if-none

      - name: Fail on critical regression or error
        if: always() && steps.eval.outputs.code != ''
        run: exit ${{ steps.eval.outputs.code }}
