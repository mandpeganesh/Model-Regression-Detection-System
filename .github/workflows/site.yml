name: Dashboard site

on:
  workflow_run:
    workflows: ["Prompt regression eval"]
    types: [completed]
  push:
    branches: [main]
    paths: ["frontend/**", "src/regress/snapshot.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # CI history lives on the eval-history branch. If it doesn't exist yet,
      # history/ stays empty and the site shows "No runs yet".
      - name: Attach eval-history
        run: |
          if git fetch origin eval-history; then
            git worktree add history FETCH_HEAD
          else
            mkdir history
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Export snapshot
        env:
          WARN_THRESHOLD: ${{ vars.WARN_THRESHOLD }}
          CRITICAL_THRESHOLD: ${{ vars.CRITICAL_THRESHOLD }}
          DRIFT_THRESHOLD: ${{ vars.DRIFT_THRESHOLD }}
          DRIFT_WINDOW: ${{ vars.DRIFT_WINDOW }}
          RELEVANCE_PASS_MIN: ${{ vars.RELEVANCE_PASS_MIN }}
        run: python -m regress export --db history/runs.db --pr-db history/pr-runs.db --out frontend/public/data/snapshot.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        env:
          VITE_DEMO: "1"
          VITE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
