[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regress"
version = "0.1.0"
description = "Regression testing for an LLM email classifier"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0",
    "deepeval>=4.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
